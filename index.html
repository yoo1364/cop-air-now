<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지금, 우리 동네 공기</title>
<style>
  :root {
    --sky: #e6f3fc;
    --sky-2: #cfe7f8;
    --white: #ffffff;
    --navy: #0b2545;
    --navy-2: #3a5370;
    --line: #d7e6f2;
    --good: #2f80ed;
    --moderate: #27ae60;
    --bad: #f2994a;
    --very-bad: #d64545;
    --check: #8a9bb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--sky);
    color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 32px 40px; }
  header { margin-bottom: 40px; }
  .badge {
    display: inline-block; margin-bottom: 12px; padding: 4px 12px;
    border-radius: 999px; background: var(--navy); color: var(--white);
    font-size: 13px; font-weight: 600; letter-spacing: .02em;
  }
  .badge[hidden] { display: none; }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--navy-2); }
  section { margin-bottom: 48px; }
  h2 { font-size: 20px; margin: 0 0 18px; letter-spacing: -.01em; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .card {
    background: var(--white); border-radius: 18px; padding: 24px;
    box-shadow: 0 1px 2px rgba(11,37,69,.06), 0 6px 20px rgba(11,37,69,.05);
  }
  .card .label { font-size: 14px; color: var(--navy-2); margin-bottom: 10px; }
  .card .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .card .value small { font-size: 15px; font-weight: 500; color: var(--navy-2); margin-left: 4px; }
  .card .note { margin-top: 8px; font-size: 14px; color: var(--navy-2); }

  section.discovery-sec { margin-bottom: 20px; }
  .discovery { border-left: 6px solid var(--check); }
  .discovery .label { font-weight: 600; color: var(--navy); }
  .discovery .sentence { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }

  .panel { background: var(--white); border-radius: 18px; padding: 28px; box-shadow: 0 1px 2px rgba(11,37,69,.06), 0 6px 20px rgba(11,37,69,.05); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 20px; padding: 0; list-style: none; font-size: 14px; color: var(--navy-2); }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 88px 1fr 92px; align-items: center; gap: 14px; font-size: 15px; }
  .bar-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 22px; background: var(--sky); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; min-width: 2px; }
  .bar-val { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-val span { color: var(--navy-2); font-size: 13px; margin-left: 4px; }

  .search-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  input[type="search"] {
    width: min(100%, 360px); padding: 12px 16px; font-size: 16px; color: var(--navy);
    border: 1px solid var(--line); border-radius: 12px; background: var(--white); outline: none;
  }
  input[type="search"]:focus { border-color: var(--good); box-shadow: 0 0 0 3px var(--sky-2); }
  .count { color: var(--navy-2); font-size: 14px; }
  .table-box { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--sky); font-size: 13px; color: var(--navy-2); font-weight: 600; z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--white); }
  .checking { color: var(--check); }
  .empty { padding: 28px; text-align: center; color: var(--navy-2); }

  .msg { background: var(--white); border-radius: 18px; padding: 28px; }
  footer { border-top: 1px solid var(--sky-2); padding-top: 24px; font-size: 14px; color: var(--navy-2); }
  footer p { margin: 4px 0; }

  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) {
    .wrap { padding: 32px 16px 28px; }
    .cards { grid-template-columns: 1fr; }
    .panel { padding: 20px 16px; }
    .bar-row { grid-template-columns: 64px 1fr 76px; gap: 10px; font-size: 14px; }
    input[type="search"] { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge" id="sample-badge" hidden>샘플 데이터(가상 값)</span>
    <h1>지금, 우리 동네 공기</h1>
    <p class="sub">전국 대기오염 측정소의 실시간 초미세먼지(PM2.5) 농도</p>
  </header>

  <main id="app">
    <div class="msg" id="loading">불러오는 중…</div>
  </main>

  <footer>
    <p>출처: 한국환경공단 에어코리아</p>
    <p>실시간 자료는 확정 전 자료로 바뀔 수 있습니다.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var GRADES = [
    { name: '좋음', max: 15, color: 'var(--good)' },
    { name: '보통', max: 35, color: 'var(--moderate)' },
    { name: '나쁨', max: 75, color: 'var(--bad)' },
    { name: '매우나쁨', max: Infinity, color: 'var(--very-bad)' }
  ];

  function gradeOf(value) {
    var v = Math.round(value);
    for (var i = 0; i < GRADES.length; i++) {
      if (v <= GRADES[i].max) return GRADES[i];
    }
    return GRADES[GRADES.length - 1];
  }

  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else if (k === 'style') node.setAttribute('style', attrs[k]);
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function avg(list) {
    var s = 0;
    for (var i = 0; i < list.length; i++) s += list[i];
    return list.length ? s / list.length : null;
  }

  function card(label, valueText, unit, note) {
    var value = el('div', { 'class': 'value', text: valueText });
    if (unit) value.appendChild(el('small', { text: unit }));
    return el('div', { 'class': 'card' }, [
      el('div', { 'class': 'label', text: label }),
      value,
      note ? el('div', { 'class': 'note', text: note }) : null
    ]);
  }

  function chip(grade) {
    return el('span', { 'class': 'chip', style: 'background:' + grade.color, text: grade.name });
  }

  function render(data) {
    var app = document.getElementById('app');
    app.textContent = '';
    if (data.sample === true) document.getElementById('sample-badge').hidden = false;

    var stations = Array.isArray(data.stations) ? data.stations : [];
    var valid = stations.filter(function (s) { return isNum(s.pm25); });

    // 시도별 평균
    var bySido = {};
    valid.forEach(function (s) {
      (bySido[s.sido] = bySido[s.sido] || []).push(s.pm25);
    });
    var sidoAvg = Object.keys(bySido).map(function (name) {
      return { name: name, avg: avg(bySido[name]), n: bySido[name].length };
    }).sort(function (a, b) { return b.avg - a.avg; });

    // ① 요약 카드
    var natAvg = avg(valid.map(function (s) { return s.pm25; }));
    var cleanest = sidoAvg[sidoAvg.length - 1];
    var dirtiest = sidoAvg[0];
    function sidoNote(x) { return x ? '평균 ' + Math.round(x.avg) + ' ㎍/㎥ · ' + gradeOf(x.avg).name : ''; }

    // ⓪ 오늘의 발견: PM2.5가 가장 높은 측정소와 전국 평균 대비 배수 (air.json에서 계산)
    var top = null, topTies = 0;
    valid.forEach(function (s) {
      if (!top || s.pm25 > top.pm25) { top = s; topTies = 0; }
      else if (s.pm25 === top.pm25) topTies++;
    });
    if (top) {
      var topGrade = gradeOf(top.pm25);
      var place = (top.sido || '') + ' ' + (top.station || '') + (topTies ? ' 외 ' + topTies + '곳' : '');
      var sentence = '지금 가장 탁한 측정소는 ' + place + '(PM2.5 ' + top.pm25 + ' ㎍/㎥, ' + topGrade.name + ')이고, ';
      sentence += natAvg > 0
        ? '전국 평균의 ' + (top.pm25 / natAvg).toFixed(1) + '배입니다.'
        : '전국 평균과 비교할 수 없습니다.';
      var discovery = el('div', { 'class': 'card discovery', style: 'border-left-color:' + topGrade.color }, [
        el('div', { 'class': 'label', text: '오늘의 발견' }),
        el('p', { 'class': 'sentence', text: sentence }),
        el('div', { 'class': 'note', text: '전국 평균 ' + natAvg.toFixed(1) + ' ㎍/㎥ · 측정소 ' + valid.length + '곳 기준(점검 중 제외)' })
      ]);
      app.appendChild(el('section', { 'class': 'discovery-sec', 'aria-label': '오늘의 발견' }, [discovery]));
    }

    app.appendChild(el('section', { 'aria-label': '요약' }, [
      el('div', { 'class': 'cards' }, [
        card('측정 시각', data.dataTime || '-', '', '수집 ' + (data.fetchedAt ? data.fetchedAt.replace('T', ' ').slice(0, 16) : '-')),
        card('전국 평균 PM2.5', natAvg === null ? '-' : String(Math.round(natAvg)), natAvg === null ? '' : '㎍/㎥',
             natAvg === null ? '' : gradeOf(natAvg).name + ' · 측정소 ' + valid.length + '곳 기준'),
        card('가장 맑은 시도', cleanest ? cleanest.name : '-', '', sidoNote(cleanest)),
        card('가장 탁한 시도', dirtiest ? dirtiest.name : '-', '', sidoNote(dirtiest))
      ])
    ]));

    // ② 시도별 막대그래프
    var maxAvg = sidoAvg.length ? Math.max(sidoAvg[0].avg, 1) : 1;
    var legend = el('ul', { 'class': 'legend' }, GRADES.map(function (g, i) {
      var range = i === 0 ? '0–15' : i === 1 ? '16–35' : i === 2 ? '36–75' : '76 이상';
      return el('li', null, [el('span', { 'class': 'dot', style: 'background:' + g.color }), el('span', { text: g.name + ' ' + range })]);
    }));
    var bars = el('div', { 'class': 'bars', role: 'list' }, sidoAvg.map(function (x) {
      var g = gradeOf(x.avg);
      var pct = Math.max(0, Math.min(100, x.avg / maxAvg * 100));
      var val = el('div', { 'class': 'bar-val', text: String(Math.round(x.avg)) });
      val.appendChild(el('span', { text: g.name }));
      return el('div', { 'class': 'bar-row', role: 'listitem', title: x.name + ' 평균 ' + x.avg.toFixed(1) + ' ㎍/㎥ (측정소 ' + x.n + '곳)' }, [
        el('div', { 'class': 'bar-name', text: x.name }),
        el('div', { 'class': 'bar-track' }, [el('div', { 'class': 'bar-fill', style: 'width:' + pct.toFixed(1) + '%;background:' + g.color })]),
        val
      ]);
    }));
    app.appendChild(el('section', null, [
      el('h2', { text: '시도별 평균 PM2.5 (㎍/㎥)' }),
      el('div', { 'class': 'panel' }, [legend, sidoAvg.length ? bars : el('div', { 'class': 'empty', text: '표시할 자료가 없습니다.' })])
    ]));

    // ③ 측정소 검색 + 표
    var sorted = stations.slice().sort(function (a, b) {
      var an = isNum(a.pm25), bn = isNum(b.pm25);
      if (an && bn) return b.pm25 - a.pm25;
      if (an) return -1;
      if (bn) return 1;
      return 0;
    });
    var input = el('input', { type: 'search', placeholder: '시도 또는 측정소 이름 검색', 'aria-label': '시도 또는 측정소 이름 검색' });
    var count = el('div', { 'class': 'count', 'aria-live': 'polite' });
    var tbody = el('tbody');
    var table = el('table', null, [
      el('thead', null, [el('tr', null, [
        el('th', { text: '순위' }), el('th', { text: '시도' }), el('th', { text: '측정소' }),
        el('th', { 'class': 'num', text: 'PM2.5' }), el('th', { 'class': 'num', text: 'PM10' }), el('th', { text: '등급' })
      ])]),
      tbody
    ]);
    var box = el('div', { 'class': 'table-box' }, [table]);

    function draw() {
      var q = input.value.trim().toLowerCase();
      var rows = q ? sorted.filter(function (s) {
        return String(s.sido || '').toLowerCase().indexOf(q) !== -1 ||
               String(s.station || '').toLowerCase().indexOf(q) !== -1;
      }) : sorted;
      tbody.textContent = '';
      var frag = document.createDocumentFragment();
      rows.forEach(function (s, i) {
        var has = isNum(s.pm25);
        frag.appendChild(el('tr', null, [
          el('td', { 'class': 'num', text: has ? String(i + 1) : '-' }),
          el('td', { text: s.sido || '' }),
          el('td', { text: s.station || '' }),
          el('td', { 'class': has ? 'num' : 'num checking', text: has ? String(s.pm25) : '점검 중' }),
          el('td', { 'class': isNum(s.pm10) ? 'num' : 'num checking', text: isNum(s.pm10) ? String(s.pm10) : '점검 중' }),
          el('td', null, [has ? chip(gradeOf(s.pm25)) : el('span', { 'class': 'checking', text: '점검 중' })])
        ]));
      });
      tbody.appendChild(frag);
      if (!rows.length) {
        tbody.appendChild(el('tr', null, [el('td', { colspan: '6', 'class': 'empty', text: '검색 결과가 없습니다.' })]));
      }
      count.textContent = '측정소 ' + rows.length + '곳' + (q ? ' (전체 ' + sorted.length + '곳)' : '');
    }
    input.addEventListener('input', draw);
    draw();

    app.appendChild(el('section', null, [
      el('h2', { text: '측정소별 PM2.5 (높은 순)' }),
      el('div', { 'class': 'panel' }, [el('div', { 'class': 'search-row' }, [input, count]), box])
    ]));
  }

  fetch('air.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      var app = document.getElementById('app');
      app.textContent = '';
      app.appendChild(el('div', { 'class': 'msg' }, [
        el('p', { text: 'air.json을 불러오지 못했습니다 (' + err.message + ').' }),
        el('p', { text: 'python3 fetch_air.py로 자료를 받은 뒤, python3 -m http.server 8000 --bind 127.0.0.1 로 열어 주세요.' })
      ]));
    });
})();
</script>
</body>
</html>
